name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  zig-tests:
    name: Zig unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig build test
        working-directory: firmware/zig
        run: zig build test

  firmware:
    name: Build firmware (ESP-IDF v5.3.2 · esp32c6)
    needs: zig-tests
    runs-on: ubuntu-latest
    # Run the whole job inside the official ESP-IDF image, forced to root so
    # apt-get / write access to /opt/esp works. This replaced an earlier
    # espressif/esp-idf-ci-action@v1 step whose runtime user changed
    # underneath us (apt-get lost root, then idf.py fell off PATH). Native
    # `container:` gives us a stable, controllable environment; the ESP-IDF
    # image's ENTRYPOINT still sources export.sh so idf.py is on PATH.
    container:
      image: espressif/idf:v5.3.2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # The CMake build shells out to `zig build` (see
      # firmware/main/CMakeLists.txt) but espressif/idf does not ship Zig,
      # so install it into the container. mlugg/setup-zig rotates through
      # working mirrors, side-stepping the ziglang.org 404s we saw when
      # curling directly from GitHub Actions IPs.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        shell: bash
        run: |
          set -eu
          . /opt/esp/idf/export.sh
          zig version
          cd firmware
          idf.py set-target esp32c6
          idf.py build
          idf.py size

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigled-esp32c6-firmware
          if-no-files-found: error
          path: |
            firmware/build/zigled.bin
            firmware/build/zigled.elf
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zigled-esp32c6-firmware
          path: artifacts

      - name: Package firmware bundle
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          BUNDLE="ZigLED-${VERSION}-esp32c6.zip"
          (cd artifacts && zip -r "../${BUNDLE}" .)
          echo "BUNDLE=${BUNDLE}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUNDLE }}
            artifacts/zigled.bin
            artifacts/bootloader/bootloader.bin
            artifacts/partition_table/partition-table.bin
            artifacts/flasher_args.json
          generate_release_notes: true
          body: |
            Prebuilt firmware for ESP32-C6, built from `${{ github.sha }}`.

            ## Flash with esptool (offsets from partitions.csv)

            ```bash
            unzip ZigLED-${{ github.ref_name }}-esp32c6.zip -d fw
            esptool.py -p /dev/tty.usbmodem* write_flash \
              0x0     fw/bootloader/bootloader.bin \
              0x8000  fw/partition_table/partition-table.bin \
              0x10000 fw/zigled.bin
            ```

            Or with `idf.py` if you already have ESP-IDF v5.3.2 installed:

            ```bash
            idf.py -p /dev/tty.usbmodem* -B fw flash
            ```
